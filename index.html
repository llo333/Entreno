<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Programa">
<title>Mi Programa Fitness</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0f0f0f; --surface: #1a1a1a; --card: #222; --border: #2e2e2e;
    --accent: #c8f55a; --text: #f0f0f0; --muted: #888;
    --danger: #ff5a5a; --info: #5ac8fa; --warn: #ffb347;
  }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, 'Helvetica Neue', sans-serif; max-width: 480px; margin: 0 auto; padding-bottom: 80px; min-height: 100vh; overflow-x: hidden; }
  button { font-family: inherit; cursor: pointer; }

  /* HEADER */
  .header { padding: 52px 18px 16px; background: linear-gradient(160deg, #1a1a1a 0%, var(--bg) 100%); border-bottom: 1px solid var(--border); }
  .header-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .header-label { font-size: 10px; letter-spacing: 3px; color: var(--accent); font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
  .header-title { font-size: 22px; font-weight: 800; line-height: 1.15; }
  .header-badge { background: var(--accent); color: #000; border-radius: 12px; padding: 6px 13px; font-size: 12px; font-weight: 700; }
  .header-sub { font-size: 11px; color: var(--muted); margin-top: 5px; text-align: right; }
  .progress-bar-bg { margin-top: 14px; background: var(--border); border-radius: 8px; height: 6px; }
  .progress-bar-fill { background: var(--accent); height: 6px; border-radius: 8px; transition: width 0.4s; }
  .progress-label { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* BOTTOM NAV */
  .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #111; border-top: 1px solid var(--border); display: flex; z-index: 100; }
  .nav-btn { flex: 1; background: none; border: none; padding: 13px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .nav-icon { font-size: 20px; }
  .nav-label { font-size: 10px; font-weight: 400; color: var(--muted); letter-spacing: 0.3px; }
  .nav-label.active { color: var(--accent); font-weight: 700; }

  /* TABS */
  .tab { display: none; }
  .tab.active { display: block; }

  /* CARDS */
  .card { background: var(--card); border-radius: 14px; margin-bottom: 8px; border: 1px solid var(--border); overflow: hidden; }
  .card.expanded { border-color: rgba(200,245,90,0.4); }
  .card-header { width: 100%; background: none; border: none; padding: 13px; display: flex; align-items: center; gap: 11px; text-align: left; }
  .card-icon { width: 38px; height: 38px; border-radius: 10px; background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .card-icon.expanded { background: rgba(200,245,90,0.15); }
  .card-meta { flex: 1; min-width: 0; }
  .card-name { font-size: 14px; font-weight: 700; color: var(--text); }
  .card-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .card-right { text-align: right; flex-shrink: 0; }
  .card-sets { font-size: 13px; font-weight: 700; color: var(--accent); }
  .card-rest { font-size: 11px; color: var(--muted); }
  .card-body { padding: 0 13px 13px; border-top: 1px solid var(--border); }
  .card-desc { font-size: 13px; color: #ccc; line-height: 1.6; margin-top: 10px; }
  .tips-title { font-size: 10px; color: var(--accent); font-weight: 700; margin: 10px 0 6px; letter-spacing: 1px; text-transform: uppercase; }
  .tip-item { display: flex; gap: 8px; margin-bottom: 5px; align-items: flex-start; }
  .tip-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); margin-top: 6px; flex-shrink: 0; }
  .tip-text { font-size: 12px; color: #bbb; line-height: 1.5; }
  .yt-hint { margin-top: 11px; background: var(--surface); border-radius: 8px; padding: 7px 11px; font-size: 11px; }

  /* SECTION BOXES */
  .box { border-radius: 12px; padding: 13px; margin-bottom: 8px; }
  .box-green { background: #1a2a1a; border: 1px solid #3a5a3a; }
  .box-blue { background: #1a1e2a; border: 1px solid #2a3a5a; }
  .box-red { background: #2a1a1a; border: 1px solid #5a2a2a; }
  .box-dark { background: var(--surface); border: 1px solid var(--border); }
  .box-title { font-size: 12px; font-weight: 700; margin-bottom: 6px; }
  .box-text { font-size: 12px; line-height: 1.7; }

  /* DAY SELECTOR */
  .day-selector { display: flex; gap: 8px; padding: 16px 16px 0; }
  .day-btn { flex: 1; padding: 10px 0; border-radius: 12px; border: 2px solid var(--border); background: var(--surface); color: var(--muted); font-weight: 700; font-size: 14px; }
  .day-btn.active-a { border-color: var(--accent); background: rgba(200,245,90,0.1); color: var(--accent); }
  .day-btn.active-b { border-color: var(--info); background: rgba(90,200,250,0.1); color: var(--info); }
  .day-btn.active-c { border-color: var(--warn); background: rgba(255,179,71,0.1); color: var(--warn); }

  /* DAY HEADER */
  .day-header { margin: 10px 16px 0; background: var(--surface); border-radius: 16px; padding: 14px; }
  .day-header-a { border-left: 4px solid var(--accent); }
  .day-header-b { border-left: 4px solid var(--info); }
  .day-header-c { border-left: 4px solid var(--warn); }
  .day-header-inner { display: flex; justify-content: space-between; align-items: center; }
  .day-title { font-weight: 800; font-size: 15px; }
  .day-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .mark-btn { border: none; border-radius: 10px; padding: 7px 13px; font-weight: 700; font-size: 12px; }
  .mark-btn.done-a { background: var(--accent); color: #000; }
  .mark-btn.done-b { background: var(--info); color: #000; }
  .mark-btn.done-c { background: var(--warn); color: #000; }
  .mark-btn.undone { background: var(--border); color: var(--muted); }

  /* MACRO GRID */
  .macro-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
  .macro-cell { background: var(--card); border-radius: 10px; padding: 10px 6px; text-align: center; }
  .macro-val { font-size: 14px; font-weight: 800; }
  .macro-label { font-size: 10px; color: var(--muted); margin-top: 2px; }

  /* FILTER */
  .filter-scroll { overflow-x: auto; padding: 12px 16px 0; }
  .filter-scroll::-webkit-scrollbar { display: none; }
  .filter-inner { display: flex; gap: 8px; width: max-content; }
  .filter-btn { padding: 7px 13px; border-radius: 20px; border: 1.5px solid var(--border); background: transparent; color: var(--muted); font-size: 12px; font-weight: 600; white-space: nowrap; }
  .filter-btn.active { border-color: var(--accent); background: rgba(200,245,90,0.1); color: var(--accent); }

  /* RECIPE BADGE */
  .batch-badge { font-size: 10px; background: rgba(90,200,250,0.15); color: var(--info); border-radius: 6px; padding: 2px 6px; font-weight: 700; }

  /* WEEKLY */
  .week-scroll { overflow-x: auto; padding: 16px 16px 0; }
  .week-scroll::-webkit-scrollbar { display: none; }
  .week-inner { display: flex; gap: 6px; width: max-content; }
  .week-btn { width: 50px; padding: 10px 0; border-radius: 12px; border: 2px solid var(--border); background: var(--surface); display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .week-btn.active { border-color: var(--accent); background: rgba(200,245,90,0.1); }
  .week-day { font-size: 10px; font-weight: 700; color: var(--muted); }
  .week-day.active { color: var(--accent); }
  .week-type { font-size: 9px; color: var(--muted); }
  .meal-card { background: var(--card); border-radius: 12px; padding: 12px 13px; margin-bottom: 8px; display: flex; align-items: center; gap: 11px; border: 1px solid var(--border); }

  /* SAFETY */
  .safety-rule { background: var(--card); border-radius: 12px; padding: 12px 13px; margin-bottom: 8px; border: 1px solid var(--border); display: flex; gap: 11px; align-items: flex-start; }
  .rule-icon { font-size: 19px; flex-shrink: 0; }
  .rule-title { font-size: 13px; font-weight: 700; }
  .rule-detail { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.5; }

  /* BREATH GRID */
  .breath-grid { display: flex; gap: 8px; margin-bottom: 8px; }
  .breath-cell { flex: 1; border-radius: 10px; padding: 10px; text-align: center; }
  .breath-icon { font-size: 18px; margin-bottom: 4px; }
  .breath-label { font-size: 11px; font-weight: 700; }
  .breath-action { font-size: 12px; margin-top: 2px; }

  /* PROGRESS MILESTONES */
  .milestone { display: flex; gap: 12px; margin-bottom: 10px; align-items: flex-start; }
  .milestone-badge { border-radius: 8px; padding: 4px 10px; font-size: 11px; font-weight: 700; flex-shrink: 0; }

  /* FORBIDDEN */
  .forbidden-item { display: flex; gap: 8px; margin-bottom: 6px; align-items: flex-start; }
  .forbidden-icon { font-size: 13px; }
  .forbidden-name { font-size: 12px; font-weight: 600; color: #e08080; }
  .forbidden-reason { font-size: 11px; color: var(--muted); }

  .pad { padding: 10px 16px 0; }
  .kcal-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
</style>
</head>

// ── STORAGE ───────────────────────────────────────────
function getWeekKey() {
  const now = new Date();
  const jan1 = new Date(now.getFullYear(), 0, 1);
  const week = Math.ceil(((now - jan1) / 86400000 + jan1.getDay() + 1) / 7);
  return now.getFullYear() + '-W' + week;
}
function saveState() {
  try {
    localStorage.setItem('fitness_v1', JSON.stringify({
      weekKey: getWeekKey(),
      checkedDays,
      totalSessions
    }));
  } catch(e) {}
}
function initState() {
  try {
    const saved = JSON.parse(localStorage.getItem('fitness_v1') || 'null');
    if (saved && saved.weekKey === getWeekKey()) {
      checkedDays = saved.checkedDays || {};
      totalSessions = saved.totalSessions || 0;
    } else {
      checkedDays = {};
      totalSessions = saved ? (saved.totalSessions || 0) : 0;
      saveState();
    }
  } catch(e) { checkedDays = {}; totalSessions = 0; }
}

// ── RENDER ────────────────────────────────────────────
function showTab(t) {
  currentTab = t;
  ['training','diet','weekly','safety'].forEach(id => {
    document.getElementById('tab-'+id).classList.toggle('active', id === t);
    const lbl = document.getElementById('nav-'+id);
    if(lbl) lbl.classList.toggle('active', id === t);
  });
  renderAll();
}

function renderAll() {
  if(currentTab === 'training') renderTraining();
  if(currentTab === 'diet') renderDiet();
  if(currentTab === 'weekly') renderWeekly();
  if(currentTab === 'safety') renderSafety();
  updateProgress();
}

function updateProgress() {
  const count = Object.values(checkedDays).filter(Boolean).length;
  document.getElementById('progressFill').style.width = (count/3*100)+'%';
  document.getElementById('progressLabel').textContent = count+'/3 esta semana · '+totalSessions+' sesiones totales';
}

function setDay(d) { currentDay = d; expandedEx = null; renderTraining(); }
function toggleDay(d) {
  const wasDone = checkedDays[d];

  saveState();
  renderTraining();
  updateProgress();
}

    </div>`;

  safetyRules.forEach(r => {
    html += `<div class="safety-rule"><span class="rule-icon">${r.icon}</span><div><div class="rule-title">${r.rule}</div><div class="rule-detail">${r.detail}</div></div></div>`;
  });

  html += `<div class="box box-green" style="margin-top:4px">
    <div class="box-title" style="color:#7ecf7e">💨 RESPIRACIÓN CORRECTA (buena práctica general)</div>
    <div class="breath-grid">
      <div class="breath-cell" style="background:#1e3a28"><div class="breath-icon">⬆️</div><div class="breath-label" style="color:#7ecf7e">Subida/Empuje</div><div class="breath-action" style="color:#a0d0a0">EXHALA</div></div>
      <div class="breath-cell" style="background:#1e3a28"><div class="breath-icon">⬇️</div><div class="breath-label" style="color:#7ecf7e">Bajada/Retorno</div><div class="breath-action" style="color:#a0d0a0">INHALA</div></div>
      <div class="breath-cell" style="background:#2a2a1e"><div class="breath-icon">⚡</div><div class="breath-label" style="color:var(--warn)">Valsalva</div><div class="breath-action" style="color:#c8a870">Solo en máximos</div></div>
    </div>
    <div class="box-text" style="color:#8ab4a0">Ya no hay restricción quirúrgica. Exhalar en el esfuerzo sigue siendo la técnica correcta en el 95% de los casos.</div>
  </div>

  <div class="box box-dark" style="margin-top:10px">
    <div class="box-title" style="color:var(--accent)">📊 HITOS DE PROGRESO</div>
    <div class="milestone"><div class="milestone-badge" style="background:rgba(200,245,90,0.15);border:1px solid var(--accent);color:var(--accent)">Mes 1</div><div style="font-size:12px;color:#bbb;padding-top:3px">Técnica dominada, −1 a −2 kg</div></div>
    <div class="milestone"><div class="milestone-badge" style="background:rgba(90,200,250,0.15);border:1px solid var(--info);color:var(--info)">Mes 2</div><div style="font-size:12px;color:#bbb;padding-top:3px">Sobrecarga real, −3 a −4 kg total</div></div>
    <div class="milestone"><div class="milestone-badge" style="background:rgba(255,179,71,0.15);border:1px solid var(--warn);color:var(--warn)">Mes 3-4</div><div style="font-size:12px;color:#bbb;padding-top:3px">−6 a −8 kg, BMI &lt;25</div></div>
  </div>

  <div class="box box-red" style="margin-top:8px">
    <div class="box-title" style="color:var(--danger)">🚨 PARA INMEDIATAMENTE SI:</div>
    <div class="box-text" style="color:#d08080">• Aparece un bulto en zona quirúrgica<br>• Dolor agudo o ardor inguinal<br>• Sensación de "tirón" o desgarro<br>• Hinchazón inusual en la zona</div>
  </div></div>`;

  document.getElementById('tab-safety').innerHTML = html;
}

// ── INIT ──────────────────────────────────────────────
initState();
renderAll();
</script>
